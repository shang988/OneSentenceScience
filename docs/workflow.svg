<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="286" viewBox="0 0 1200 286" role="img" aria-labelledby="title description">
  <title id="title">From one observation to a careful answer</title>
  <desc id="description">Four steps: observe, ask, find evidence, and answer with limits. 四步：观察、提问、找证据、有边界地回答。</desc>
  <rect width="1200" height="286" rx="24" fill="#f3f5ed"/>
  <text x="38" y="43" fill="#244947" font-family="Arial, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700">A question can start with everyday life.</text>
  <text x="38" y="70" fill="#5b7570" font-family="Arial, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16">一个科学问题，可以从生活里开始。</text>
  <g font-family="Arial, 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
    <rect x="34" y="94" width="264" height="151" rx="17" fill="#ffffff" stroke="#dce5d9" stroke-width="2"/>
    <circle cx="68" cy="127" r="19" fill="#dceecf"/><text x="68" y="133" text-anchor="middle" fill="#28534b" font-size="16" font-weight="700">1</text>
    <text x="53" y="177" fill="#244947" font-size="27" font-weight="700">Observe</text>
    <text x="53" y="216" fill="#61716d" font-size="20">观察生活</text>
    <path d="M302 169 h24 m-8-8 8 8-8 8" fill="none" stroke="#91b196" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="330" y="94" width="264" height="151" rx="17" fill="#ffffff" stroke="#dce5d9" stroke-width="2"/>
    <circle cx="364" cy="127" r="19" fill="#dceecf"/><text x="364" y="133" text-anchor="middle" fill="#28534b" font-size="16" font-weight="700">2</text>
    <text x="349" y="177" fill="#244947" font-size="27" font-weight="700">Ask</text>
    <text x="349" y="216" fill="#61716d" font-size="20">提出问题</text>
    <path d="M598 169 h24 m-8-8 8 8-8 8" fill="none" stroke="#91b196" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="626" y="94" width="264" height="151" rx="17" fill="#ffffff" stroke="#dce5d9" stroke-width="2"/>
    <circle cx="660" cy="127" r="19" fill="#dceecf"/><text x="660" y="133" text-anchor="middle" fill="#28534b" font-size="16" font-weight="700">3</text>
    <text x="645" y="177" fill="#244947" font-size="27" font-weight="700">Find evidence</text>
    <text x="645" y="216" fill="#61716d" font-size="20">查找证据</text>
    <path d="M894 169 h24 m-8-8 8 8-8 8" fill="none" stroke="#91b196" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="922" y="94" width="244" height="151" rx="17" fill="#ffffff" stroke="#dce5d9" stroke-width="2"/>
    <circle cx="956" cy="127" r="19" fill="#dceecf"/><text x="956" y="133" text-anchor="middle" fill="#28534b" font-size="16" font-weight="700">4</text>
    <text x="941" y="177" fill="#244947" font-size="27" font-weight="700">Answer carefully</text>
    <text x="941" y="216" fill="#61716d" font-size="20">有边界地回答</text>
  </g>
</svg>
